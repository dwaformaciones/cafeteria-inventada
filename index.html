<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Aroma de Barrio · Pedidos</title>
<meta name="description" content="Pide online en Aroma de Barrio">
<meta name="theme-color" content="#123028">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aroma de Barrio">

<style>
  :root{
    --bg-0:#0b1210;
    --bg-1:#0f1c18;
    --bg-2:#152621;
    --panel:#132420;
    --border:#26443a;
    --cyan:#2dd4bf;
    --cyan-dim:#1c8f83;
    --gold:#d4af37;
    --text:#eef3f1;
    --text-dim:#9fb3ad;
    --radius:16px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html,body{
    margin:0;
    padding:0;
    background:
      radial-gradient(circle at 50% -10%, var(--bg-2), var(--bg-1) 55%, var(--bg-0) 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family: "Georgia", "Iowan Old Style", "Palatino Linotype", serif;
    min-height:100vh;
  }

  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:24px 16px 140px;
  }

  header{
    text-align:center;
    padding:18px 0 20px;
  }

  header h1{
    font-family: "Times New Roman", "Iowan Old Style", Georgia, serif;
    font-style:italic;
    font-weight:400;
    font-size:2.3rem;
    margin:0;
    letter-spacing:.5px;
    color:#fbf7ee;
    text-shadow: 0 0 22px rgba(45,212,191,.15);
  }

  header p{
    margin:6px 0 0;
    font-family: "Helvetica Neue", Arial, sans-serif;
    text-transform:uppercase;
    letter-spacing:3px;
    font-size:.68rem;
    color:var(--text-dim);
  }

  .divider{
    height:1px;
    background:linear-gradient(90deg, transparent, var(--border), transparent);
    margin:18px 0;
  }

  /* Loyalty card */
  .loyalty{
    background:linear-gradient(160deg, var(--panel), var(--bg-1));
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:22px;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .loyalty-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
  }
  .loyalty-top h2{
    margin:0;
    font-size:.95rem;
    font-weight:600;
    color:var(--cyan);
    letter-spacing:.5px;
  }
  .loyalty-top span{
    font-size:.75rem;
    color:var(--text-dim);
  }
  .stamps{
    display:grid;
    grid-template-columns:repeat(8, 1fr);
    gap:8px;
  }
  .stamp{
    aspect-ratio:1;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1.5px dashed var(--border);
    font-size:.9rem;
  }
  .stamp.filled{
    border:1.5px solid var(--gold);
    background:radial-gradient(circle at 35% 30%, rgba(212,175,55,.35), rgba(212,175,55,.08));
    color:var(--gold);
  }
  .loyalty-note{
    margin-top:10px;
    font-size:.72rem;
    color:var(--text-dim);
    text-align:center;
  }

  /* Tabs */
  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 6px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--bg-1);
    color:var(--text-dim);
    font-size:.85rem;
    cursor:pointer;
    transition:all .2s ease;
    user-select:none;
  }
  .tab.active{
    background:linear-gradient(160deg, rgba(45,212,191,.18), rgba(45,212,191,.05));
    border-color:var(--cyan-dim);
    color:var(--cyan);
    font-weight:600;
  }

  /* Menu list */
  .category{
    display:none;
    animation: fade .25s ease;
  }
  .category.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:14px 4px;
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  .item:last-child{ border-bottom:none; }

  .item-info{ flex:1; min-width:0; }
  .item-name{
    font-size:1.05rem;
    color:var(--text);
  }
  .item-price{
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size:.82rem;
    color:var(--text-dim);
    margin-top:2px;
  }

  .qty-control{
    display:flex;
    align-items:center;
    gap:10px;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  .qty-btn{
    width:32px;
    height:32px;
    border-radius:50%;
    border:1px solid var(--cyan-dim);
    background:var(--bg-1);
    color:var(--cyan);
    font-size:1.1rem;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .1s ease, background .2s ease;
  }
  .qty-btn:active{ transform:scale(.9); background:rgba(45,212,191,.15); }
  .qty-val{
    min-width:18px;
    text-align:center;
    font-size:1rem;
    font-variant-numeric: tabular-nums;
  }

  /* Sticky footer / total bar */
  .footer-bar{
    position:fixed;
    left:0; right:0; bottom:0;
    background:linear-gradient(180deg, rgba(11,18,16,0), var(--bg-0) 30%);
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:10px;
    z-index:10;
  }
  .footer-inner{
    max-width:520px;
    margin:0 auto;
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .total-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:"Helvetica Neue", Arial, sans-serif;
    margin-bottom:10px;
  }
  .total-row .label{
    font-size:.85rem;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .total-row .amount{
    font-size:1.4rem;
    color:var(--cyan);
    font-weight:600;
  }
  .order-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    background:linear-gradient(135deg, #25d366, #128c7e);
    box-shadow:0 6px 18px rgba(37,211,102,.35);
    color:#ffffff;
    font-family:"Helvetica Neue", Arial, sans-serif;
    font-weight:700;
    font-size:1rem;
    letter-spacing:.5px;
    cursor:pointer;
    transition:filter .2s ease, transform .1s ease, box-shadow .2s ease;
  }
  .order-btn svg{
    width:20px;
    height:20px;
    flex-shrink:0;
    fill:#ffffff;
  }
  .order-btn:disabled{
    opacity:.4;
    box-shadow:none;
    cursor:not-allowed;
  }
  .order-btn:not(:disabled):active{ transform:scale(.98); filter:brightness(1.1); box-shadow:0 3px 10px rgba(37,211,102,.35); }

  footer.contact{
    text-align:center;
    font-family:"Helvetica Neue", Arial, sans-serif;
    color:var(--text-dim);
    font-size:.72rem;
    margin-top:26px;
    line-height:1.6;
  }

  .toast{
    position:fixed;
    top:16px;
    left:50%;
    transform:translateX(-50%) translateY(-20px);
    background:var(--panel);
    border:1px solid var(--cyan-dim);
    color:var(--cyan);
    padding:10px 18px;
    border-radius:999px;
    font-family:"Helvetica Neue", Arial, sans-serif;
    font-size:.82rem;
    opacity:0;
    transition:all .3s ease;
    z-index:50;
    pointer-events:none;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Aroma de Barrio</h1>
    <p>Cafetería · Desde 2015</p>
  </header>

  <div class="loyalty">
    <div class="loyalty-top">
      <h2>Tarjeta de fidelidad</h2>
      <span id="loyaltyCount">5 / 8</span>
    </div>
    <div class="stamps" id="stamps"></div>
    <div class="loyalty-note">8 cafés sellados = el 9º gratis</div>
  </div>

  <div class="divider"></div>

  <nav class="tabs" id="tabs"></nav>

  <main id="categories"></main>
</div>

<div class="footer-bar">
  <div class="footer-inner">
    <div class="total-row">
      <span class="label">Total</span>
      <span class="amount" id="totalAmount">0,00 €</span>
    </div>
    <button class="order-btn" id="orderBtn" disabled>
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M16.02 3C9.4 3 4 8.38 4 15c0 2.4.7 4.63 1.9 6.5L4 29l7.7-1.85A11.9 11.9 0 0 0 16.02 27C22.63 27 28 21.62 28 15S22.63 3 16.02 3Zm0 21.6c-1.98 0-3.85-.53-5.46-1.46l-.39-.23-4.6 1.1 1.13-4.5-.25-.4A9.5 9.5 0 1 1 25.5 15c0 5.3-4.28 9.6-9.48 9.6Zm5.4-7.13c-.29-.15-1.73-.86-2-.96-.27-.1-.46-.15-.66.15-.2.29-.75.95-.92 1.15-.17.2-.34.22-.63.07-.29-.15-1.24-.46-2.36-1.47-.87-.78-1.46-1.74-1.63-2.03-.17-.29-.02-.45.13-.6.13-.13.29-.34.44-.51.15-.17.2-.29.29-.49.1-.2.05-.37-.02-.51-.07-.15-.66-1.6-.9-2.2-.24-.57-.48-.5-.66-.5h-.56c-.2 0-.51.07-.78.37-.27.29-1.02 1-1.02 2.43 0 1.43 1.05 2.82 1.2 3.01.15.2 2.06 3.14 4.99 4.4.7.3 1.24.48 1.67.61.7.22 1.34.19 1.84.12.56-.08 1.73-.71 1.97-1.39.24-.68.24-1.27.17-1.39-.07-.12-.27-.2-.56-.34Z"/>
      </svg>
      Pedir por WhatsApp
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const WHATSAPP_NUMBER = "618700142";

  const MENU = {
    "Bebidas": [
      { id: "cafe-leche", name: "Café con leche", price: 1.80 },
      { id: "cappuccino", name: "Cappuccino", price: 2.20 },
      { id: "cafe-solo", name: "Café solo", price: 1.50 },
      { id: "zumo-naranja", name: "Zumo de naranja natural", price: 2.50 },
      { id: "te-infusion", name: "Té / Infusión", price: 1.80 }
    ],
    "Para picar": [
      { id: "tostada", name: "Tostada con tomate y aceite", price: 2.50 },
      { id: "croissant", name: "Croissant", price: 1.50 },
      { id: "bocadillo-jamon", name: "Bocadillo de jamón", price: 3.50 },
      { id: "napolitana", name: "Napolitana de chocolate", price: 1.70 }
    ]
  };

  const LOYALTY_STAMPS = 5;
  const LOYALTY_TOTAL = 8;

  const state = {};
  Object.values(MENU).flat().forEach(item => { state[item.id] = 0; });

  const tabsEl = document.getElementById("tabs");
  const categoriesEl = document.getElementById("categories");
  const totalEl = document.getElementById("totalAmount");
  const orderBtn = document.getElementById("orderBtn");
  const toastEl = document.getElementById("toast");
  const stampsEl = document.getElementById("stamps");
  const loyaltyCountEl = document.getElementById("loyaltyCount");

  function formatPrice(n){
    return n.toFixed(2).replace(".", ",") + " €";
  }

  function renderStamps(){
    stampsEl.innerHTML = "";
    for(let i = 1; i <= LOYALTY_TOTAL; i++){
      const s = document.createElement("div");
      s.className = "stamp" + (i <= LOYALTY_STAMPS ? " filled" : "");
      s.textContent = i <= LOYALTY_STAMPS ? "☕" : "";
      stampsEl.appendChild(s);
    }
    loyaltyCountEl.textContent = LOYALTY_STAMPS + " / " + LOYALTY_TOTAL;
  }

  function renderTabsAndMenu(){
    const categoryNames = Object.keys(MENU);

    categoryNames.forEach((cat, idx) => {
      const tab = document.createElement("div");
      tab.className = "tab" + (idx === 0 ? " active" : "");
      tab.textContent = cat;
      tab.dataset.cat = cat;
      tab.addEventListener("click", () => switchTab(cat));
      tabsEl.appendChild(tab);

      const section = document.createElement("section");
      section.className = "category" + (idx === 0 ? " active" : "");
      section.dataset.cat = cat;

      MENU[cat].forEach(item => {
        const row = document.createElement("div");
        row.className = "item";
        row.innerHTML = `
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            <div class="item-price">${formatPrice(item.price)}</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn" data-action="minus" data-id="${item.id}" aria-label="Restar">−</button>
            <span class="qty-val" id="qty-${item.id}">0</span>
            <button class="qty-btn" data-action="plus" data-id="${item.id}" aria-label="Sumar">+</button>
          </div>
        `;
        section.appendChild(row);
      });

      categoriesEl.appendChild(section);
    });
  }

  function switchTab(cat){
    document.querySelectorAll(".tab").forEach(t => {
      t.classList.toggle("active", t.dataset.cat === cat);
    });
    document.querySelectorAll(".category").forEach(c => {
      c.classList.toggle("active", c.dataset.cat === cat);
    });
  }

  function updateQty(id, delta){
    const newVal = Math.max(0, state[id] + delta);
    state[id] = newVal;
    document.getElementById("qty-" + id).textContent = newVal;
    updateTotal();
  }

  function getAllItems(){
    return Object.values(MENU).flat();
  }

  function updateTotal(){
    let total = 0;
    getAllItems().forEach(item => {
      total += item.price * state[item.id];
    });
    totalEl.textContent = formatPrice(total);
    orderBtn.disabled = total <= 0;
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  function buildOrderMessage(){
    const lines = [];
    let total = 0;
    getAllItems().forEach(item => {
      const qty = state[item.id];
      if(qty > 0){
        const subtotal = item.price * qty;
        total += subtotal;
        lines.push(`• ${qty}x ${item.name} — ${formatPrice(subtotal)}`);
      }
    });
    if(lines.length === 0) return null;

    const message =
      "Hola Aroma de Barrio 👋, quiero hacer este pedido:\n\n" +
      lines.join("\n") +
      `\n\nTotal: ${formatPrice(total)}`;

    return message;
  }

  function sendOrder(){
    const message = buildOrderMessage();
    if(!message){
      showToast("Añade algo al pedido primero");
      return;
    }
    const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    window.open(url, "_blank");
  }

  categoriesEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".qty-btn");
    if(!btn) return;
    const id = btn.dataset.id;
    const delta = btn.dataset.action === "plus" ? 1 : -1;
    updateQty(id, delta);
  });

  orderBtn.addEventListener("click", sendOrder);

  renderStamps();
  renderTabsAndMenu();
  updateTotal();

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
})();
</script>

</body>
</html>
